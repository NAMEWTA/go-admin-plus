# SQLite 单进程服务：API 和后台任务在同一进程。
http:
  listen: 0.0.0.0:8080
  trustedProxies: []
log:
  level: info
runtime:
  role: all
  dataDir: /var/lib/go-admin-plus
database:
  driver: sqlite
  sqlite:
    path: database.sqlite3
redis:
  enabled: false
storage:
  defaultProvider: local
  local:
    root: files
  maxUploadBytes: 10485760
  allowedTypes: [application/pdf, image/jpeg, image/png, text/plain]
audit:
  retentionDays: 30
