name: go-admin-plus

x-api: &api
  image: ${GO_ADMIN_SERVER_IMAGE:?GO_ADMIN_SERVER_IMAGE must be an image@sha256 digest reference}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=512m,uid=10001,gid=10001,mode=0700
  networks: [backend]
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  stop_grace_period: 20s
  restart: unless-stopped

x-web: &web
  image: ${GO_ADMIN_WEB_IMAGE:?GO_ADMIN_WEB_IMAGE must be an image@sha256 digest reference}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,uid=101,gid=101,mode=0700
    - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0750
    - /var/run:size=2m,uid=101,gid=101,mode=0750
  ports:
    - "${GO_ADMIN_WEB_BIND:-127.0.0.1}:${GO_ADMIN_WEB_PORT:-8080}:8080"
  networks: [edge, backend]
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  stop_grace_period: 10s
  restart: unless-stopped

services:
  postgres:
    profiles: [postgres]
    image: postgres:17.11-alpine3.23@sha256:9ae4e8f8d0284836a505f0b2e825144e32e20499856e7dc5f7b99e19d10eedd6
    environment:
      POSTGRES_DB: go_admin_plus
      POSTGRES_USER: go_admin_plus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run/postgresql:size=4m,uid=70,gid=70,mode=0750
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_admin_plus -d go_admin_plus"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  migrate-postgres:
    <<: *api
    profiles: [postgres]
    command:
      - migrate
      - --profile=server-postgres
      - --config=/run/config/server-postgres.yaml
      - --data-root=/var/lib/go-admin-plus
    environment:
      GO_ADMIN_DATABASE_DSN_FILE: /run/secrets/database_dsn
    configs:
      - source: server_postgres
        target: /run/config/server-postgres.yaml
    secrets: [database_dsn]
    volumes:
      - postgres-product-data:/var/lib/go-admin-plus
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api-postgres:
    <<: *api
    profiles: [postgres]
    command:
      - serve
      - --profile=server-postgres
      - --config=/run/config/server-postgres.yaml
      - --data-root=/var/lib/go-admin-plus
    environment:
      GO_ADMIN_DATABASE_DSN_FILE: /run/secrets/database_dsn
    configs:
      - source: server_postgres
        target: /run/config/server-postgres.yaml
    secrets: [database_dsn]
    volumes:
      - postgres-product-data:/var/lib/go-admin-plus
    depends_on:
      postgres:
        condition: service_healthy
      migrate-postgres:
        condition: service_completed_successfully

  worker-postgres:
    <<: *api
    profiles: [postgres]
    command:
      - worker
      - --profile=server-postgres
      - --config=/run/config/server-postgres.yaml
      - --data-root=/var/lib/go-admin-plus
    environment:
      GO_ADMIN_DATABASE_DSN_FILE: /run/secrets/database_dsn
    configs:
      - source: server_postgres
        target: /run/config/server-postgres.yaml
    secrets: [database_dsn]
    volumes:
      - postgres-product-data:/var/lib/go-admin-plus
    depends_on:
      postgres:
        condition: service_healthy
      migrate-postgres:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  web-postgres:
    <<: *web
    profiles: [postgres]
    environment:
      API_UPSTREAM: api-postgres:8080
    depends_on:
      api-postgres:
        condition: service_healthy

  migrate-sqlite:
    <<: *api
    profiles: [sqlite]
    command:
      - migrate
      - --profile=server-sqlite
      - --config=/run/config/server-sqlite.yaml
      - --data-root=/var/lib/go-admin-plus
      - --with-worker
    environment:
      GO_ADMIN_SQLITE_PATH: /var/lib/go-admin-plus/database.sqlite3
    configs:
      - source: server_sqlite
        target: /run/config/server-sqlite.yaml
    volumes:
      - sqlite-product-data:/var/lib/go-admin-plus

    healthcheck:
      disable: true
    restart: "no"

  api-sqlite:
    <<: *api
    profiles: [sqlite]
    command:
      - serve
      - --profile=server-sqlite
      - --config=/run/config/server-sqlite.yaml
      - --data-root=/var/lib/go-admin-plus
      - --with-worker
    environment:
      GO_ADMIN_SQLITE_PATH: /var/lib/go-admin-plus/database.sqlite3
    configs:
      - source: server_sqlite
        target: /run/config/server-sqlite.yaml
    volumes:
      - sqlite-product-data:/var/lib/go-admin-plus

    depends_on:
      migrate-sqlite:
        condition: service_completed_successfully

  web-sqlite:
    <<: *web
    profiles: [sqlite]
    environment:
      API_UPSTREAM: api-sqlite:8080
    depends_on:
      api-sqlite:
        condition: service_healthy

configs:
  server_postgres:
    file: ./config/server-postgres.yaml
  server_sqlite:
    file: ./config/server-sqlite.yaml

secrets:
  postgres_password:
    file: ./runtime/secrets/postgres_password
  database_dsn:
    file: ./runtime/secrets/database_dsn

volumes:
  postgres-data:
  postgres-product-data:
  sqlite-product-data:

networks:
  edge:
  backend:
    internal: true
