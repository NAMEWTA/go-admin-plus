[package]
name = "go-admin-plus-desktop"
version = "0.0.3"
description = "Go Admin Plus Tauri desktop host"
edition = "2024"
rust-version = "1.88"

[features]
custom-protocol = ["tauri/custom-protocol"]
native-e2e = ["custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
sha2 = "=0.10.9"
base64 = "=0.23.1"
getrandom = "=0.4.3"
keyring = "=4.1.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-stronghold = "=2.3.1"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.3.3"
tokio = { version = "=1.53.1", features = ["macros", "sync", "time"] }
ureq = { version = "=3.4.0", default-features = false, features = ["json", "rustls"] }
url = "=2.5.8"
zeroize = { version = "=1.9.0", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
