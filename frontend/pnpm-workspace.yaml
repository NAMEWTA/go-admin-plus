packages:
  - apps/*
  - packages/*
  - packages/adapters/*
  - packages/domains/*
  - packages/web-domains/*

autoInstallPeers: false
dedupePeerDependents: true
disallowWorkspaceCycles: true
engineStrict: true
linkWorkspacePackages: true
preferWorkspacePackages: true
saveExact: true
strictPeerDependencies: true

catalog:
  '@types/node': 26.2.0
  '@vitejs/plugin-vue': 6.0.8
  '@vue/compiler-sfc': 3.5.41
  '@vue/test-utils': 2.4.6
  element-plus: 2.14.5
  happy-dom: 20.12.0
  '@lucide/vue': 1.33.0
  oxlint: 1.80.0
  sass: 1.103.1
  typescript: 6.0.3
  vite: 8.2.1
  vitest: 4.1.10
  vue: 3.5.41
  vue-router: 4.6.4
  vue-tsc: 3.3.10

minimumReleaseAgeExclude:
  - '@redocly/cli@2.48.0'

allowBuilds:
  '@parcel/watcher': false
