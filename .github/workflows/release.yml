name: Release
run-name: release ${{ github.ref_name }}

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.ref_name }}
  SOURCE_SHA: ${{ github.sha }}

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Verify exact semver tag and source contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          node release/manifest/product-release.mjs preflight --version "$RELEASE_VERSION" --root-ref "$SOURCE_SHA"
          node scripts/quality/compatibility-zero.mjs
          node scripts/quality/docs-check.mjs
          node --test scripts/release/linux/verify-policy.test.mjs scripts/release/macos/verify-policy.test.mjs scripts/release/windows/verify-policy.test.mjs

  linux:
    name: Linux server service archives
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build Linux service packages
        shell: bash
        run: |
          scripts/release/linux/build-service.sh "$RELEASE_VERSION" "$SOURCE_SHA" release-output
          (cd release-output && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: release-output
          if-no-files-found: error
          retention-days: 7

  linux-desktop:
    name: Linux x64 desktop
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version-file: backend/go.mod}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.22.3}
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: corepack enable && corepack pnpm@11.1.3 --dir frontend install --frozen-lockfile
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: go -C backend mod download
      - run: scripts/release/linux/build-desktop.sh "$RELEASE_VERSION" release-desktop-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: release-linux-desktop, path: release-desktop-output, if-no-files-found: error}

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      matrix:
        include:
          - {runner: macos-15, arch: arm64, target: aarch64-apple-darwin}
          - {runner: macos-15-intel, arch: x64, target: x86_64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install workspace and ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "building $(uname -m)"
          rustup target add "${{ matrix.target }}"
          pnpm --dir frontend install --frozen-lockfile
          go -C backend mod download
          brew install syft
      - name: Build and verify unsigned ARM64 app
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/macos/build.sh "$RELEASE_VERSION" "$GITHUB_RUN_NUMBER" "release-work/Go Admin Plus.app"
          scripts/release/macos/verify-app.sh "release-work/Go Admin Plus.app" private-release
          dmg=$(find frontend/apps/admin-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          scripts/release/macos/verify-dmg.sh "$dmg"
          scripts/release/macos/emit-artifacts.sh "$RELEASE_VERSION" "$SOURCE_SHA" "release-work/Go Admin Plus.app" "$dmg" release-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-output
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Configure byte-exact checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install workspace and x64 Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Windows x64 runner required.' }
          rustup target add x86_64-pc-windows-msvc
          pnpm --dir frontend install --frozen-lockfile
          go -C backend mod download
          cargo install tauri-driver --version 2.0.6 --locked
          $edge = Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $edgeVersion = $edge.VersionInfo.ProductVersion
          $driverDirectory = Join-Path $env:RUNNER_TEMP 'edge-driver'
          $driverArchive = Join-Path $env:RUNNER_TEMP 'edge-driver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edgeVersion/edgedriver_win64.zip" -OutFile $driverArchive
          Expand-Archive $driverArchive -DestinationPath $driverDirectory
          $driverDirectory | Out-File -FilePath $env:GITHUB_PATH -Append
          $archive = Join-Path $env:RUNNER_TEMP 'syft.zip'
          Invoke-WebRequest -Uri 'https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_windows_amd64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fc5ffaeffb993576ece9c791da5a688fb2c8969a1479bbfe58583672c64da336') { throw 'Syft checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'syft')
          "$env:RUNNER_TEMP\syft" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build and verify unsigned x64 NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/release/windows/build-nsis.ps1 -Version $env:RELEASE_VERSION -OutputDirectory release-output
          ./scripts/release/windows/verify-install.ps1 -InstallerFile (Join-Path (Resolve-Path release-output) "go-admin-plus-$env:RELEASE_VERSION-windows-x64-setup.exe") -EvidenceFile (Join-Path (Resolve-Path release-output) 'install-evidence.json')
          ./scripts/release/windows/emit-artifacts.ps1 -Version $env:RELEASE_VERSION -SourceSha $env:SOURCE_SHA -InstallerFile (Join-Path (Resolve-Path release-output) "go-admin-plus-$env:RELEASE_VERSION-windows-x64-setup.exe") -ApplicationFile (Join-Path (Resolve-Path release-output) 'go-admin-plus-desktop.exe') -InstallEvidenceFile (Join-Path (Resolve-Path release-output) 'install-evidence.json') -OutputDirectory release-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release-evidence
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [linux, linux-desktop, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: false
      - name: Prepare uniquely named release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            # 发布时文件会加平台前缀，原目录内的校验清单不再适用。
            [[ "${file##*/}" != SHA256SUMS ]] || continue
            relative=${file#artifacts/}
            asset_name=${relative//\//-}
            # GitHub 会改写带空格的附件名，先规范化，保证远端校验清单可直接使用。
            asset_name=${asset_name// /-}
            [[ "$asset_name" =~ ^[a-zA-Z0-9._-]+$ ]]
            destination="release-assets/$asset_name"
            test ! -e "$destination"
            cp "$file" "$destination"
          done
          test -n "$(find release-assets -type f -print -quit)"
          (cd release-assets && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Create published release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Go Admin Plus $RELEASE_VERSION" --notes-file "release/notes/$RELEASE_VERSION.md" release-assets/*
