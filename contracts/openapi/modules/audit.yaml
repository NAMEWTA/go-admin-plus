openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Audit API
  version: 1.0.0
  description: Authorized audit fact queries, detail, and retention cleanup.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: Same-origin API base path.
x-go-admin-module: audit
x-go-admin-codegen:
  owner: audit
  goPackage: audittransport
  goOutput: backend/internal/modules/audit/transport/openapi.gen.go
  typescriptOutput: frontend/packages/domains/audit/src/generated
security:
  - SessionCookie: []
paths:
  /audit/records:
    get:
      operationId: listAuditRecords
      summary: List authorized audit facts
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000000 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/AuditKind' }
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: outcome
          in: query
          schema: { $ref: '#/components/schemas/AuditOutcome' }
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/AuditSource' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: A stable page of redacted audit facts.
          headers:
            X-CSRF-Token: { $ref: '#/components/headers/CsrfToken' }
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/AuthorizedAuthorizationProblem' }
        '500': { $ref: '#/components/responses/AuthorizedInternalProblem' }
  /audit/records/{id}:
    get:
      operationId: getAuditRecord
      summary: Read one authorized audit fact
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 10, maxLength: 350, pattern: '^a1\.(ls|lf|oc|ou|od)\.[A-Za-z0-9_-]+$' }
      responses:
        '200':
          description: The redacted audit fact.
          headers:
            X-CSRF-Token: { $ref: '#/components/headers/CsrfToken' }
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditFact' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/AuthorizedAuthorizationProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '500': { $ref: '#/components/responses/AuthorizedInternalProblem' }
  /audit/records/cleanup:
    post:
      operationId: cleanupAuditRecords
      summary: Delete one bounded batch of retention-eligible audit facts
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupAuditRequest' }
      responses:
        '200':
          description: The bounded cleanup result.
          headers:
            X-CSRF-Token: { $ref: '#/components/headers/CsrfToken' }
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupAuditResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/AuthorizedAuthorizationProblem' }
        '409': { $ref: '#/components/responses/AuthorizedConflictProblem' }
        '500': { $ref: '#/components/responses/AuthorizedInternalProblem' }
components:
  securitySchemes:
    SessionCookie:
      $ref: ../components/security-schemes.yaml#/SessionCookie
    CsrfToken:
      $ref: ../components/security-schemes.yaml#/CsrfToken
  headers:
    CsrfToken:
      description: The stable anti-forgery token shared by the authenticated Session family.
      required: true
      schema: { type: string, minLength: 43, maxLength: 43 }
  responses:
    ValidationProblem: { $ref: ../components/responses.yaml#/ValidationProblem }
    AuthenticationProblem: { $ref: ../components/responses.yaml#/AuthenticationProblem }
    NotFoundProblem: { $ref: ../components/responses.yaml#/NotFoundProblem }
    AuthorizedAuthorizationProblem:
      description: The authenticated account cannot perform this operation.
      headers:
        X-CSRF-Token:
          schema: { type: string, minLength: 43, maxLength: 43 }
        Set-Cookie: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AuthorizedConflictProblem:
      description: The cleanup conflicts with the retention policy.
      headers:
        X-CSRF-Token: { $ref: '#/components/headers/CsrfToken' }
        Set-Cookie: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AuthorizedInternalProblem:
      description: The request failed without exposing infrastructure details.
      headers:
        X-CSRF-Token:
          schema: { type: string, minLength: 43, maxLength: 43 }
        Set-Cookie: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem: { $ref: ../components/schemas.yaml#/Problem }
    AuditKind:
      type: string
      enum: [login, operation]
    AuditAction:
      type: string
      enum: [login, create, update, delete]
    AuditOutcome:
      type: string
      enum: [succeeded, failed]
    AuditSource:
      type: string
      enum: [web, desktop, server]
    ActorType:
      type: string
      enum: [account, system]
    AuditFact:
      type: object
      additionalProperties: false
      required: [id, kind, action, outcome, actorType, source, subject, occurredAt]
      properties:
        id: { type: string, minLength: 10, maxLength: 350, pattern: '^a1\.(ls|lf|oc|ou|od)\.[A-Za-z0-9_-]+$' }
        eventId: {type: string, minLength: 36, maxLength: 36}
        traceId: {type: string, minLength: 16, maxLength: 64}
        operation: {type: string, minLength: 1, maxLength: 100}
        kind: { $ref: '#/components/schemas/AuditKind' }
        action: { $ref: '#/components/schemas/AuditAction' }
        outcome: { $ref: '#/components/schemas/AuditOutcome' }
        actorType: { $ref: '#/components/schemas/ActorType' }
        source: { $ref: '#/components/schemas/AuditSource' }
        subject: { type: string, minLength: 3, maxLength: 132, pattern: '^[a-z0-9][a-z0-9_:-]+$' }
        actorRef: { type: string, minLength: 9, maxLength: 72, pattern: '^account:[a-z0-9][a-z0-9_-]{0,63}$' }
        occurredAt: { type: string, format: date-time }
    AuditPage:
      type: object
      additionalProperties: false
      required: [records, total, page, pageSize]
      properties:
        records:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AuditFact' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    CleanupAuditRequest:
      type: object
      additionalProperties: false
      required: [before, confirmation]
      properties:
        before: { type: string, format: date-time }
        confirmation:
          type: string
          const: delete-expired-audit-records
    CleanupAuditResponse:
      type: object
      additionalProperties: false
      required: [deleted, moreEligible]
      properties:
        deleted: { type: integer, minimum: 0, maximum: 1000 }
        moreEligible: { type: boolean }
