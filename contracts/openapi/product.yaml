openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Go Admin Plus Product API
  version: 1.0.0
  description: Complete Server and Desktop product contract composed from module-owned fragments.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: Same-origin product API base path.
security:
  - SessionCookie: []
paths:
  /runtime/info:
    get:
      operationId: getRuntimeInfo
      summary: Public protocol version and upload limits
      security: []
      responses:
        '200':
          description: Non-sensitive runtime capabilities.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [apiVersion, modules, maxUploadBytes, allowedTypes]
                properties:
                  apiVersion: {type: integer, const: 1}
                  modules: {type: array, items: {type: string}}
                  maxUploadBytes: {type: integer, minimum: 1, maximum: 1073741824}
                  allowedTypes: {type: array, items: {type: string}}
  /iam/session/login:
    $ref: ./modules/iam-session.yaml#/paths/~1iam~1session~1login
  /iam/session/current:
    $ref: ./modules/iam-session.yaml#/paths/~1iam~1session~1current
  /iam/session/heartbeat:
    $ref: ./modules/iam-session.yaml#/paths/~1iam~1session~1heartbeat
  /iam/session/renew:
    $ref: ./modules/iam-session.yaml#/paths/~1iam~1session~1renew
  /iam/session/logout:
    $ref: ./modules/iam-session.yaml#/paths/~1iam~1session~1logout
  /iam/account/profile:
    $ref: ./modules/iam-session.yaml#/paths/~1iam~1account~1profile
  /iam/account/password:
    $ref: ./modules/iam-session.yaml#/paths/~1iam~1account~1password
  /iam/administration/manifest:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1manifest
  /iam/administration/users:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1users
  /iam/administration/users/{userId}:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1users~1{userId}
  /iam/administration/users/{userId}/deletion:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1users~1{userId}~1deletion
  /iam/administration/users/{userId}/deletion/cancel:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1users~1{userId}~1deletion~1cancel
  /iam/administration/users/{userId}/roles:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1users~1{userId}~1roles
  /iam/administration/users/{userId}/password:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1users~1{userId}~1password
  /iam/administration/roles:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1roles
  /iam/administration/roles/{roleId}:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1roles~1{roleId}
  /iam/administration/roles/{roleId}/grants:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1roles~1{roleId}~1grants
  /iam/administration/menus:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1menus
  /iam/administration/menus/{menuId}:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1menus~1{menuId}
  /iam/administration/permissions:
    $ref: ./modules/iam-administration.yaml#/paths/~1iam~1administration~1permissions
  /audit/records:
    $ref: ./modules/audit.yaml#/paths/~1audit~1records
  /audit/records/{id}:
    $ref: ./modules/audit.yaml#/paths/~1audit~1records~1{id}
  /audit/records/cleanup:
    $ref: ./modules/audit.yaml#/paths/~1audit~1records~1cleanup
  /scheduler/task-types:
    $ref: ./modules/scheduler.yaml#/paths/~1scheduler~1task-types
  /scheduler/definitions:
    $ref: ./modules/scheduler.yaml#/paths/~1scheduler~1definitions
  /scheduler/definitions/{definitionId}:
    $ref: ./modules/scheduler.yaml#/paths/~1scheduler~1definitions~1{definitionId}
  /scheduler/definitions/{definitionId}/run:
    $ref: './modules/scheduler.yaml#/paths/~1scheduler~1definitions~1{definitionId}~1run'
  /scheduler/definitions/{definitionId}/enable:
    $ref: ./modules/scheduler.yaml#/paths/~1scheduler~1definitions~1{definitionId}~1enable
  /scheduler/definitions/{definitionId}/stop:
    $ref: ./modules/scheduler.yaml#/paths/~1scheduler~1definitions~1{definitionId}~1stop
  /scheduler/executions:
    $ref: ./modules/scheduler.yaml#/paths/~1scheduler~1executions
  /files/objects:
    $ref: ./modules/files.yaml#/paths/~1files~1objects
  /files/objects/batch-delete:
    $ref: ./modules/files.yaml#/paths/~1files~1objects~1batch-delete
  /files/objects/{fileId}:
    $ref: ./modules/files.yaml#/paths/~1files~1objects~1{fileId}
  /files/objects/{fileId}/content:
    $ref: ./modules/files.yaml#/paths/~1files~1objects~1{fileId}~1content
components:
  securitySchemes:
    SessionCookie:
      $ref: ./components/security-schemes.yaml#/SessionCookie
    CsrfToken:
      $ref: ./components/security-schemes.yaml#/CsrfToken
