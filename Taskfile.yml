version: '3'

silent: true

vars:
  PROFILE: '{{default "server-sqlite" .PROFILE}}'
  RUN_SCRIPT: node scripts/backend/run-script.mjs

tasks:
  default:
    desc: List the public product tasks
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/task-list.sh'

  dev:
    desc: Start one development target (TARGET=server|web|desktop)
    vars:
      TARGET: '{{default "server" .TARGET}}'
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/dev.sh "{{.TARGET}}" "{{.PROFILE}}"'

  build:
    desc: Build product targets (TARGET=all|server|web|desktop)
    vars:
      TARGET: '{{default "all" .TARGET}}'
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/build.sh "{{.TARGET}}" "{{.PROFILE}}"'

  test:
    desc: Run backend and frontend non-E2E tests
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/test.sh'
      - '{{.RUN_SCRIPT}} scripts/frontend/test.sh'

  lint:
    desc: Run backend and frontend static checks
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/lint.sh'
      - '{{.RUN_SCRIPT}} scripts/frontend/lint.sh'

  generate:
    desc: Regenerate canonical backend and frontend transports
    cmds:
      - '{{.RUN_SCRIPT}} scripts/contracts/generate.sh'

  contract:lint:
    desc: Lint and test the modular OpenAPI contract policy
    cmds:
      - '{{.RUN_SCRIPT}} scripts/contracts/generate.sh verify'

  generate:check:
    desc: Reject generated OpenAPI transport drift
    cmds:
      - '{{.RUN_SCRIPT}} scripts/contracts/generate.sh generate --check'

  migrate:
    desc: Migrate the selected backend profile database
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/migrate.sh "{{.PROFILE}}"'

  worker:
    desc: Run the dedicated backend worker role
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/worker.sh "{{.PROFILE}}"'

  doctor:
    desc: Run the read-only backend diagnostic report
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/doctor.sh "{{.PROFILE}}"'

  package:
    desc: Produce local packages for one target (TARGET=server|web|desktop)
    vars:
      TARGET: '{{default "server" .TARGET}}'
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/package.sh "{{.TARGET}}" "{{.PROFILE}}"'

  release:
    desc: Run the local, non-publishing release preflight
    requires:
      vars: [VERSION]
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/release.sh preflight "{{.VERSION}}"'

  release:verify:
    desc: Verify all local release policies and manifest contracts
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/release.sh verify'

  governance:check:
    desc: Verify that repository governance is owned only by the root
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/governance-check.sh'

  architecture:check:
    desc: Verify canonical backend, frontend, command, and workspace boundaries
    cmds:
      - node scripts/quality/architecture-check.mjs

  compatibility:zero:
    desc: Reject removed paths, dependencies, names, and compatibility modes
    cmds:
      - node scripts/quality/compatibility-zero.mjs

  docs:check:
    desc: Verify current documentation links and repository naming
    cmds:
      - node scripts/quality/docs-check.mjs

  task:contract:
    desc: Verify the public task and failure-propagation contract
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/task-contract.sh'

  lint:staged:
    desc: Run the repository pre-commit checks
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/lint-staged.sh'
      - '{{.RUN_SCRIPT}} scripts/frontend/lint-staged.sh'

  task:failure-probe:
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/failure-probe.sh'

  release:preflight:
    internal: true
    requires:
      vars: [VERSION]
    cmds:
      - '{{.RUN_SCRIPT}} scripts/backend/release.sh preflight "{{.VERSION}}"'
